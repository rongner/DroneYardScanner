services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: droneyardscanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  api:
    build:
      context: src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/droneyardscanner
      KINDWISE_API_KEY: ${KINDWISE_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost"]'
    volumes:
      - ./photos:/app/photos
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: src/web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
