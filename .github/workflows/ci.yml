name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r src/backend/requirements.txt -r src/backend/requirements-dev.txt

      - name: Test
        working-directory: src
        run: python -m pytest tests/ -v

  test-web:
    name: Test Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        working-directory: src/web
        run: npm ci

      - name: Lint
        working-directory: src/web
        run: npm run lint

      - name: Build (type-check + bundle)
        working-directory: src/web
        run: npm run build

  build-api:
    name: Build API image
    needs: [test-backend, test-web]
    uses: rongner-portfolio/workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: droneyardscanner-api
      context: src/backend
      dockerfile: src/backend/Dockerfile
    permissions:
      contents: read
      packages: write

  build-web:
    name: Build Web image
    needs: [test-backend, test-web]
    uses: rongner-portfolio/workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: droneyardscanner-web
      context: src/web
      dockerfile: src/web/Dockerfile
    permissions:
      contents: read
      packages: write

  scan:
    name: Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/rongner/droneyardscanner-api:latest
            name: api
          - image: ghcr.io/rongner/droneyardscanner-web:latest
            name: web

    steps:
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.name }}
